<style>
/* bop brand system (mirrors index.html) */
:root{
  --paper:#f2f2f7; --card:#ffffff; --ink:#0a0a0a; --dim:#666; --faint:#999;
  --line:#e5e5e7; --orange:#FF6319; --blue:#0039A6; --green:#00933C;
  --yellow:#F4C522; --red:#D0021B;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Helvetica Neue",Helvetica,Arial,-apple-system,sans-serif;
  padding-bottom:env(safe-area-inset-bottom);
}
#page{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header.top{
  position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;
  padding:calc(env(safe-area-inset-top) + 12px) 18px 10px;
  border-bottom:6px solid var(--yellow);
  display:flex;align-items:center;justify-content:space-between;
}
.wbullet{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;
  justify-content:center;color:#fff;font-weight:700;font-size:15px;line-height:1}
.wordmark{display:flex;gap:4px}
.getapp{
  background:#fff;color:var(--ink);font-weight:700;font-size:13px;
  padding:8px 14px;border-radius:999px;text-decoration:none;
}
main{flex:1;padding:20px 18px 40px}
.bophead{text-align:center;margin:10px 0 18px}
.bophead .emoji{font-size:44px;line-height:1.1}
.bophead h1{font-size:24px;font-weight:800;margin-top:6px}
.bophead .meta{color:var(--dim);font-size:14px;margin-top:4px}
#map{height:220px;border-radius:14px;margin:0 0 18px;border:1px solid var(--line)}
.stop{display:flex;gap:12px}
.rail{display:flex;flex-direction:column;align-items:center}
.dot{width:26px;height:26px;border-radius:50%;background:#fff;border:4px solid var(--orange);
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex:none}
.railline{width:4px;flex:1;background:var(--orange)}
.stopcard{background:var(--card);border-radius:14px;padding:12px 14px;margin:0 0 16px;flex:1}
.stopcard .time{color:var(--orange);font-weight:800;font-size:12px}
.stopcard .name{font-weight:700;font-size:16px;margin:2px 0}
.stopcard .place{color:var(--dim);font-size:14px}
.stopcard .note{font-size:14px;margin-top:4px}
.cta{
  display:block;text-align:center;background:var(--ink);color:#fff;font-weight:800;
  border-radius:14px;padding:16px;margin:22px 0 8px;text-decoration:none;font-size:16px;
}
.subcta{text-align:center;color:var(--faint);font-size:12px}
.state{padding:60px 24px;text-align:center;color:var(--dim);font-size:15px}
footer{padding:18px;text-align:center;color:var(--faint);font-size:12px}
footer a{color:var(--faint)}
</style>

<body>
<div id="page">
  <header class="top">
    <a class="wordmark" href="/" aria-label="bop home" style="text-decoration:none">
      <span class="wbullet" style="background:var(--orange)">b</span>
      <span class="wbullet" style="background:var(--blue)">o</span>
      <span class="wbullet" style="background:var(--green)">p</span>
    </a>
    <a class="getapp" id="getapp-top" href="https://apps.apple.com/app/id6783394972">Get the app</a>
  </header>
  <main>
    <div id="content"><div class="state">Loading this bop&hellip;</div></div>
  </main>
  <footer>
    your day, stop by stop &middot; <a href="/privacy">privacy</a> &middot; <a href="/terms">terms</a>
  </footer>
</div>

<script>
const SUPABASE_URL = "https://zsmueetbropiddolzxxo.supabase.co";
const ANON_KEY = "sb_publishable_3S1xaWVkXZa8IKzm6U9Xsw_H9zwYrXg";
const APP_STORE = "https://apps.apple.com/app/id6783394972";

function esc(s){const d=document.createElement("div");d.textContent=s??"";return d.innerHTML;}
function fmtTime(t){
  if(!t) return "";
  const m = /^(\d{1,2}):(\d{2})$/.exec(t.trim());
  if(!m) return esc(t);
  let h = +m[1]; const min = m[2]; const suf = h >= 12 ? "PM" : "AM";
  h = h % 12 || 12;
  return min === "00" ? `${h} ${suf}` : `${h}:${min} ${suf}`;
}

function bopId(){
  // /b/<id> via redirect, or ?id=<id> fallback
  const parts = location.pathname.split("/").filter(Boolean);
  if(parts[0] === "b" && parts[1]) return decodeURIComponent(parts[1]);
  return new URLSearchParams(location.search).get("id");
}

async function load(){
  const id = bopId();
  const content = document.getElementById("content");
  if(!id){ content.innerHTML = notFound(); return; }
  let rows;
  try{
    const r = await fetch(`${SUPABASE_URL}/rest/v1/bops?select=data,handle,city,neighborhood&id=eq.${encodeURIComponent(id)}&is_public=eq.true`,
      {headers:{apikey:ANON_KEY}});
    rows = await r.json();
  }catch(e){
    content.innerHTML = notFound();
    return;
  }
  if(!Array.isArray(rows) || !rows.length){ content.innerHTML = notFound(); return; }
  render(rows[0]);
  try{ posthog.capture("share_page_view", {bop_id:id}); }catch(e){}
}

function notFound(){
  return `<div class="state">This bop isn't available anymore.<br><br>
    Plan your own perfect day, stop by stop.</div>
    <a class="cta" href="${APP_STORE}">Get Bop for iPhone</a>`;
}

function render(row){
  const d = row.data || {};
  const stops = (d.stops||[]);
  const by = row.handle ? `by ${esc(row.handle)}` : "";
  const where = [row.neighborhood, row.city].filter(Boolean).join(", ") || d.area || "";
  document.title = `${d.title||"A bop"} — bop`;

  let html = `<div class="bophead">
    <div class="emoji">${esc(d.emoji||"🌆")}</div>
    <h1>${esc(d.title||"A great day")}</h1>
    <div class="meta">${esc(where)}${by?` &middot; ${by}`:""}</div>
  </div>`;

  const coords = stops.filter(s=>s.lat!=null&&s.lng!=null);
  if(coords.length) html += `<div id="map"></div>`;

  html += stops.map((s,i)=>`
    <div class="stop">
      <div class="rail"><div class="dot">${i+1}</div>${i<stops.length-1?'<div class="railline"></div>':""}</div>
      <div class="stopcard">
        ${s.time?`<div class="time">${fmtTime(s.time)}</div>`:""}
        <div class="name">${esc((s.emoji?s.emoji+" ":"")+(s.title||""))}</div>
        ${s.place?`<div class="place">📍 ${esc(s.place)}</div>`:""}
        ${s.note?`<div class="note">${esc(s.note)}</div>`:""}
      </div>
    </div>`).join("");

  html += `<a class="cta" href="${APP_STORE}" id="getapp-main">Save this day — get Bop for iPhone</a>
    <div class="subcta">Free on the App Store &middot; NYC first, more cities soon</div>`;

  document.getElementById("content").innerHTML = html;

  // Map is a bonus: never let a map failure take down the page.
  try{
    if(coords.length && typeof L !== "undefined"){
      const map = L.map("map",{scrollWheelZoom:false});
      L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",
        {attribution:"&copy; OpenStreetMap &copy; CARTO"}).addTo(map);
      const pts = [];
      coords.forEach((s)=>{
        const idx = stops.indexOf(s)+1;
        const icon = L.divIcon({className:"", html:
          `<div style="width:26px;height:26px;border-radius:50%;background:#fff;border:4px solid #FF6319;display:flex;align-items:center;justify-content:center;font:800 11px Helvetica">${idx}</div>`,
          iconSize:[26,26], iconAnchor:[13,13]});
        L.marker([s.lat,s.lng],{icon}).addTo(map).bindPopup(esc(s.place||s.title||""));
        pts.push([s.lat,s.lng]);
      });
      if(pts.length>1){ L.polyline(pts,{color:"#FF6319",weight:3,opacity:.7}).addTo(map); }
      // Let the container get layout before fitting, else Leaflet fits the world.
      setTimeout(()=>{ map.invalidateSize(); map.fitBounds(L.latLngBounds(pts).pad(0.25)); }, 0);
    }
  }catch(e){ document.getElementById("map")?.remove(); }

  document.getElementById("getapp-main")?.addEventListener("click",()=>posthog.capture("share_page_cta_tap"));
}

load();
</script>
</body>
</html>
